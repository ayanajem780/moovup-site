<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Marketing Moov Up</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan : outil de travail dense. Barre d'onglets en haut, tableau en 3 colonnes pour les tâches,
   fiches datées pour les tournages. Neutres froids tirés vers le bleu nuit, un seul accent bleu vif,
   les univers ont chacun une pastille de couleur + leur nom. */
:root{
  /* Identité Complexe Moov'Up Sports : bleu pétrole et orange du logo, gris anthracite, fond blanc */
  --brand-blue:#0c6c94; --brand-orange:#ea6d2a; --brand-grey:#575757;
  --bg:#f3f7f9; --surface:#ffffff; --sunken:#edf2f5; --line:#d9e2e8;
  --ink:#2a2f33; --muted:#5d676e;
  --accent:#0c6c94; --accent-ink:#ffffff; --accent-soft:#dcedf4;
  --ok:#17794a; --ok-soft:#dbf3e6; --warn:#8f4a10; --warn-soft:#fde6d6; --bad:#c22543; --bad-soft:#fde0e6;
  --s-todo:#5aa9c9; --s-doing:#ea6d2a; --s-done:#2fae6b; --s-late:#d93654; --s-violet:#0c6c94;
  --display:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;width:100%;margin:0 auto;padding:0 18px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 18px;margin:14px 0 12px;background:var(--surface);border-radius:var(--r);border-bottom:3px solid var(--brand-orange);box-shadow:0 1px 3px rgba(42,47,51,.07)}
.logo{height:52px;width:auto;flex:none}
h1{color:var(--brand-blue);padding-left:18px;border-left:2px solid var(--line)}
h1{font:700 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 13px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.shell:has(.side[hidden]){grid-template-columns:minmax(0,1fr)}
.side{background:var(--brand-blue);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side[hidden]{display:none}
nav{display:flex;flex-direction:column;gap:2px}
.navh{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.72);padding:16px 10px 6px}
nav .dot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.who{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto;overflow-wrap:anywhere}
.gate{max-width:520px;margin:32px auto}
nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:#fff;font-weight:500;font-size:14px;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.14)}
nav a:focus-visible{outline-color:#fff}
nav a[aria-current="page"]{background:#fff;color:var(--brand-blue);border-left-color:var(--brand-orange)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:9px 12px;margin:0 0 12px;font-size:14px}
.note[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.bar .grow{flex:1}
select,input[type=text],input[type=date],input[type=time],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn{text-decoration:none;display:inline-block}
.gate-on header.top,.gate-on #note{display:none}
.gate-on .wrap{max-width:none;padding:0}
.lux{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100vh;background:#fff}
.lux-photo{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 46%,#f39447 0%,#ea6d2a 52%,#d85c1c 100%);min-height:260px}
.lux-photo canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lux-eyebrow{font:600 11.5px/1.2 var(--body);letter-spacing:.22em;text-transform:uppercase;margin:0 0 14px;color:var(--brand-orange)}
.lux-panel{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(24px,5vw,64px) 24px;background:linear-gradient(180deg,#fff 0%,#f4f8fa 100%)}
.lux-card{width:100%;max-width:400px;display:flex;flex-direction:column}
.lux-card img{height:57px;width:auto;align-self:flex-start;margin-bottom:34px}
.lux-card h2{font:600 32px/1.1 var(--body);color:#0a3447;margin:0 0 10px;letter-spacing:-.01em}
.lux-p{margin:0 0 22px;color:var(--muted);line-height:1.55}
.lux-form{display:flex;flex-direction:column}
.lux-form label{font:600 11.5px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.lux-form input{border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:9px 2px 11px;margin-bottom:22px;font-size:16px;background:transparent}
.lux-form input:focus{outline:0;border-bottom-color:var(--brand-blue)}
.lux-form input:focus-visible{outline:0;box-shadow:0 2px 0 var(--brand-blue)}
.lux-btn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;border:1.5px solid #0a3447;background:#0a3447;color:#fff;font:600 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:16px 18px;border-radius:2px;cursor:pointer;transition:background .2s,border-color .2s}
.lux-btn:hover{background:var(--brand-blue);border-color:var(--brand-blue)}
.lux-btn[disabled]{opacity:.6;cursor:wait}
.lux-btn.ghost{background:#fff;color:#0a3447;border-color:var(--line);text-transform:none;letter-spacing:0;font-size:15px;font-weight:500}
.lux-btn.ghost:hover{background:#fff;border-color:#0a3447}
.lux-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.lux-links button{background:none;border:0;padding:2px 0;color:var(--brand-blue);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lux-or{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:24px 0 18px}
.lux-or::before,.lux-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lux-msg{margin:0 0 18px;padding:11px 14px;border-radius:2px;font-size:14px;border-left:3px solid}
.lux-msg.bad{background:var(--bad-soft);color:var(--bad)}
.lux-msg.ok{background:var(--ok-soft);color:var(--ok)}
.lux-foot{margin:34px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media (max-width:860px){.lux{grid-template-columns:minmax(0,1fr)}.lux-photo{min-height:240px}.lux-panel{justify-content:flex-start}}
.chat .msgs{display:flex;flex-direction:column;gap:8px;max-height:56vh;min-height:220px;overflow-y:auto;padding:4px}
.msg{max-width:min(78%,560px);background:var(--sunken);border-radius:12px;padding:8px 12px;align-self:flex-start}
.msg.mine{align-self:flex-end;background:var(--accent-soft)}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.msg .mh b{color:var(--brand-blue)}
.msg p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .btn{padding:0 6px;font-size:12px;margin-left:auto}
.spaces{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.spaces .sp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;background:var(--sunken);border-radius:8px;padding:7px 10px}
.spaces .sp .grow{flex:1}
.spaces .check{padding:0}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunken);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h2{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 2px 4px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.card{border-left:4px solid var(--s-todo)}
.col.k-doing .card{border-left-color:var(--s-doing)}
.col.k-done .card{border-left-color:var(--s-done)}
.card.late{border-left-color:var(--s-late)}
.col{border-top:4px solid var(--s-todo)}
.col.k-doing{border-top-color:var(--s-doing)}
.col.k-done{border-top-color:var(--s-done)}
.col h2{color:var(--ink)}
.tiles .tile{border-top:4px solid var(--s-todo)}
.tiles .tile:nth-child(2){border-top-color:var(--s-late)}
.tiles .tile:nth-child(3){border-top-color:var(--s-done)}
.tiles .tile:nth-child(4){border-top-color:var(--s-violet)}
.block,.card,.tile,.shoot{box-shadow:0 1px 3px rgba(31,42,68,.06)}
.day .ev.sh{border-left-color:var(--s-violet)}
.day .ev.lt{border-left-color:var(--s-late)}
.card .t{font-weight:600;overflow-wrap:anywhere;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.card .t:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;background:var(--sunken);color:var(--ink);white-space:nowrap}
.pill.kind-c{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:14px;padding:10px 4px}
.shoot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px}
.shoot .when{font-variant-numeric:tabular-nums}
.shoot .when b{display:block;font:700 17px/1.2 var(--display);text-transform:capitalize}
.shoot h3{margin:0 0 6px;font:600 16px/1.3 var(--body);overflow-wrap:anywhere}
.shoot .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin-top:10px}
.shoot h4{margin:0 0 4px;font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px}
.check input{margin-top:3px;flex:none}
.check.done span.x{text-decoration:line-through;color:var(--muted)}
.alert{grid-column:1/-1;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 11px;font-size:14px;font-weight:500}
details.past{margin-top:18px}
details.past summary{cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.bad b{color:var(--bad)}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;overflow-x:auto}
section.block h2{font:700 17px/1.2 var(--display);margin:0 0 10px;color:var(--brand-blue)}
.tile b{color:var(--brand-blue)}
.seg button[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--brand-orange)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.prog{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--s-done)}
.member{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.member:last-of-type{border-bottom:0}
.member input{flex:1 1 160px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog form{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font:700 19px/1.2 var(--display);margin:0}
.f{display:flex;flex-direction:column;gap:4px}
.f>label,.f>span.l{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.f{flex:1 1 130px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer}
.choices label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:6px}
.line input{flex:1 1 auto}
.line select{flex:0 1 150px}
.err{color:var(--bad);font-size:14px;min-height:1px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dash>section{margin:0;grid-column:span 6}
.dash>section.wide{grid-column:1/-1}
.dash>section.third{grid-column:span 4}
.dash>section.two3{grid-column:span 8}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.donut text{font:700 22px var(--display);fill:var(--ink)}
.donut text.s{font:400 10px var(--body);fill:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend span{display:flex;gap:8px;align-items:center}
.legend b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:14px}
.sq{width:10px;height:10px;border-radius:3px;flex:none}
.c-todo{background:var(--s-todo)}.c-doing{background:var(--s-doing)}.c-done{background:var(--s-done)}
.load{display:flex;flex-direction:column;gap:10px}
.load .r{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:4px 12px;align-items:center;font-size:14px}
.load .r small{grid-column:2;color:var(--muted);font-size:12.5px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunken);gap:2px}
.stack i{display:block;height:100%}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.items li:last-child{border-bottom:0}
.items .g{flex:1 1 160px;overflow-wrap:anywhere;font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--sunken);border-radius:8px;padding:8px;min-height:96px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.day.today{outline:2px solid var(--accent)}
.day h3{margin:0;font:600 12px/1.2 var(--body);color:var(--muted);text-transform:capitalize}
.day .ev{background:var(--surface);border-radius:6px;padding:3px 6px;overflow-wrap:anywhere;border-left:3px solid var(--s-todo)}
.day .ev.sh{font-weight:600}
.day .ev.lt{border-left-color:var(--bad)}
.fiche{display:grid;grid-template-columns:270px minmax(0,1fr) 290px;gap:14px;align-items:start}
.fiche>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.fiche section.block{margin:0}
.ident{display:flex;gap:12px;align-items:center}
.ident .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 22px var(--display);flex:none}
.ident h2{margin:0!important;font-size:19px!important}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.kv{display:flex;flex-direction:column;gap:10px;margin:0}
.kv div{display:flex;flex-direction:column;gap:3px}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv input,.kv textarea{width:100%}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.bh h2{margin:0!important;flex:1}
.aib{background:var(--brand-orange);color:#fff;font:700 11px/1 var(--body);padding:4px 7px;border-radius:5px;letter-spacing:.04em}
.aitxt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ailist{list-style:none;margin:0;padding:0}
.ailist li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ailist li:last-child{border-bottom:0}
.ailist li>div{flex:1 1 220px}
.ailist b{display:block}
.facts{margin:10px 0 0;padding:9px 12px;background:var(--sunken);border-radius:8px;font-size:14px}
.qa{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.qa .q{align-self:flex-end;background:var(--accent-soft);border-radius:12px;padding:8px 12px;max-width:80%}
.qa .a{background:var(--sunken);border-radius:12px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:90%}
@media (max-width:1100px){.fiche{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fiche>div:nth-child(2){grid-column:1/-1;order:3}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:8px}
  nav{flex-direction:row;overflow-x:auto}
  nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  nav a[aria-current="page"]{border-bottom-color:var(--brand-orange)}
  .navh{display:none}
  .fiche{grid-template-columns:minmax(0,1fr)}
  h1{padding-left:0;border-left:0}
  .dash>section,.dash>section.third,.dash>section.two3{grid-column:1/-1}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
  .shoot{grid-template-columns:1fr}
  .shoot .cols{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Habillage haut de gamme : bleu nuit, titres en serif, filets fins, ombres douces ===== */
:root{--navy:#0a3447;--navy-deep:#062636;--serif:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--r:14px;
  --bg:#f4f6f7;--sunken:#edf1f3;--line:#dfe6ea;--ink:#102a36;--muted:#5b6b74;--accent:#0a3447;--accent-soft:#e1edf2}
:root[data-theme="dark"]{color-scheme:dark;--bg:#061820;--surface:#0c2733;--sunken:#09202b;--line:#1b3f4e;--ink:#eaf2f5;--muted:#9db4be;
  --accent:#7fd0ee;--accent-ink:#04202c;--accent-soft:#123a4b;--brand-blue:#7fd0ee;
  --ok:#62d39c;--ok-soft:#0f3a2a;--warn:#f2b56b;--warn-soft:#3f2a12;--bad:#ff8fa3;--bad-soft:#44202a}
.lux{color-scheme:light;--line:#d9e2e8;--muted:#5d676e;--brand-blue:#0c6c94;--ink:#102a36;--bad:#c22543;--bad-soft:#fde0e6;--ok:#17794a;--ok-soft:#dbf3e6;color:#102a36}
body{letter-spacing:.005em}
.shell{grid-template-columns:232px minmax(0,1fr)}
.side{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);padding:18px 12px 24px;box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.brand{background:#fff;border-radius:16px;width:76px;height:76px;margin:4px auto 16px;display:grid;place-items:center;box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
.brand img{width:56px;height:auto}
.navh{letter-spacing:.2em;font-size:10.5px;color:rgba(255,255,255,.5);padding:20px 12px 8px}
nav a{font-weight:400;color:rgba(255,255,255,.82);padding:9px 12px;border-radius:6px;border-left:2px solid transparent;transition:background .18s,color .18s}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a[hidden]{display:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.role{font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--accent-soft);color:var(--brand-blue)}
nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--brand-orange);font-weight:500}
.wrap{max-width:1560px;margin:0;padding:0 clamp(18px,3vw,44px) 64px}
header.top{background:none;box-shadow:none;border-radius:0;border-bottom:1px solid var(--line);margin:0 0 22px;padding:22px 0 16px;gap:12px 14px}
header.top .ttl{margin-right:auto;min-width:0}
h1{padding:0;border:0;font:600 clamp(24px,2.3vw,32px)/1.12 var(--body);color:var(--ink);letter-spacing:-.015em}
.crumb{margin:0 0 6px;font:600 10.5px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--brand-orange)}
.who{margin-left:0}
.kbtn{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 10px 8px 12px;cursor:pointer;font-size:14px;min-width:0}
.kbtn:hover{border-color:var(--muted);color:var(--ink)}
.kbtn[hidden],.livedot[hidden]{display:none}
kbd{font:500 11px/1 var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--sunken);color:var(--muted)}
.livedot{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.livedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-done);box-shadow:0 0 0 0 rgba(47,174,107,.5);animation:pulse 2s infinite}
.livedot.off::before{background:var(--s-late);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,174,107,.5)}70%{box-shadow:0 0 0 8px rgba(47,174,107,0)}100%{box-shadow:0 0 0 0 rgba(47,174,107,0)}}
section.block,.card,.tile,.shoot{border:1px solid var(--line);box-shadow:0 1px 2px rgba(10,52,71,.04),0 14px 34px -22px rgba(10,52,71,.28)}
section.block{padding:20px 22px}
section.block h2,.bh h2{font:600 17px/1.25 var(--body);color:var(--ink);letter-spacing:-.005em}
.ident h2{font-size:19px!important}
.shoot h3{font:600 16px/1.3 var(--body)}
.shoot .when b{font:600 16px/1.3 var(--body)}
.shoot h4,.col h2,th,.kv dt,.f>label,.f>span.l{letter-spacing:.14em;font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.tiles .tile{border-top:1px solid var(--line);padding:18px 20px;position:relative;overflow:hidden}
.tiles .tile::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--brand-orange),transparent 70%)}
.tile b{font:300 44px/1 var(--body);letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink);margin-bottom:8px}
.tile.bad b{color:var(--bad)}
.tile span{letter-spacing:.14em;font-size:10.5px;text-transform:uppercase}
.btn{border-radius:6px;transition:border-color .15s,background .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);letter-spacing:.03em}
.seg{border-radius:8px}
.seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(10,52,71,.12),inset 0 -2px 0 var(--brand-orange)}
.col{background:transparent;border:1px solid var(--line);border-top:2px solid var(--s-todo);border-radius:var(--r);padding:12px}
.pill{font-weight:500;letter-spacing:.01em}
.aib{background:linear-gradient(110deg,var(--brand-orange),#f2b56b 45%,#3aa3c9);background-size:220% 100%;animation:shine 5s linear infinite;border-radius:4px;letter-spacing:.14em}
@keyframes shine{0%{background-position:0 0}50%{background-position:100% 0}100%{background-position:0 0}}
select,input[type=text],input[type=date],input[type=time],input[type=email],textarea{border-radius:8px;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--brand-blue);box-shadow:0 0 0 3px var(--accent-soft)}
dialog{border-radius:16px;box-shadow:0 30px 80px -20px rgba(6,38,54,.5)}
dialog::backdrop{background:rgba(6,38,54,.55);backdrop-filter:blur(3px)}
dialog h2{font:600 21px/1.2 var(--body)}
.note{border-radius:8px;border-left:3px solid currentColor}
#main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.06s}#main.enter>*:nth-child(3){animation-delay:.12s}#main.enter>*:nth-child(4){animation-delay:.18s}
#main.enter .dash>section,#main.enter .fiche>div{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#main.enter .dash>section:nth-child(2),#main.enter .fiche>div:nth-child(2){animation-delay:.08s}
#main.enter .dash>section:nth-child(n+3),#main.enter .fiche>div:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pal{width:min(640px,calc(100% - 24px));padding:0;margin-top:12vh;overflow:hidden}
#palQ{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 20px;font-size:17px;background:transparent}
#palQ:focus{box-shadow:none;border-color:var(--line)}
#palList{list-style:none;margin:0;padding:6px;max-height:46vh;overflow-y:auto}
#palList li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;cursor:pointer}
#palList li[aria-selected="true"]{background:var(--accent-soft)}
#palList li span{flex:1;overflow-wrap:anywhere}
#palList li small{color:var(--muted);letter-spacing:.12em;font-size:10.5px;text-transform:uppercase;white-space:nowrap}
.palh{margin:0;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:760px){.brand{display:none}.shell{grid-template-columns:minmax(0,1fr)}.side{padding:8px}nav a{border-left:0}.kbtn span,.kbtn kbd{display:none}header.top{padding-top:14px}}
@media (prefers-reduced-motion:reduce){#main.enter>*,#main.enter .dash>section,#main.enter .fiche>div,.aib,.livedot::before{animation:none!important}}
.nbadge{margin-left:auto;background:var(--brand-orange);color:#fff;font:600 11px/1 var(--body);padding:4px 7px;border-radius:999px;min-width:20px;text-align:center}
.toasts{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 32px))}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--brand-orange);border-radius:12px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(6,38,54,.45);display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 12px;align-items:start;animation:tin .35s cubic-bezier(.2,.7,.2,1) both}
.toast .av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 15px var(--body);grid-row:span 2}
.toast b{font-size:14px;overflow-wrap:anywhere}
.toast p{margin:0;grid-column:2/4;font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.toast .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.toast .go{grid-column:2/4;justify-self:start;margin-top:6px}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
a.tile{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
a.tile::after{content:"→";position:absolute;right:18px;bottom:16px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:opacity .18s,transform .18s}
a.tile:hover{transform:translateY(-2px);border-color:var(--brand-blue);box-shadow:0 1px 2px rgba(10,52,71,.05),0 18px 40px -22px rgba(10,52,71,.45)}
a.tile:hover::after,a.tile:focus-visible::after{opacity:1;transform:none}
.back{display:inline-flex;gap:6px;align-items:center;margin:-6px 0 14px;background:none;border:0;padding:0;color:var(--brand-blue);cursor:pointer;font-size:14px}
.rep h3{margin:16px 0 6px;font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* ===== Tableau de bord façon tableau analytique ===== */
:root{--chart-cur:#0c6c94;--chart-prev:#7b868c}
:root[data-theme="dark"]{--chart-cur:#5cc3ea;--chart-prev:#7a8a92}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:-4px 0 18px}
.hello{margin:0 0 4px;font:600 26px/1.15 var(--body);letter-spacing:-.015em;color:var(--ink)}
.dhead .meta{margin:0}
.dctl{display:flex;gap:8px;flex-wrap:wrap}
.dctl select,.dctl .btn{padding:9px 14px;border-radius:10px;font-weight:500;background:var(--surface)}
.dctl .btn[aria-pressed="true"]{border-color:var(--brand-blue);color:var(--brand-blue)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(10,52,71,.04);transition:transform .18s,border-color .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);border-color:var(--brand-blue);box-shadow:0 16px 36px -22px rgba(10,52,71,.45)}
.kl{color:var(--muted);font-size:14px}
.kpi b{font:600 34px/1.1 var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi b small{font-size:16px;font-weight:400;color:var(--muted);margin-left:2px}
.ks{font-size:13.5px}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}.dl{color:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:14px}
.dgrid section.block{margin:0}
.dgrid .wide2{grid-column:1/-1}
.dgrid h2{font-size:18px!important}
.lg{display:inline-flex;gap:7px;align-items:center;font-size:14px;color:var(--ink)}
.lcur,.lprev{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--chart-cur)}
.lprev{border-top:2px dashed var(--chart-prev)}
.chart{position:relative;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.cg{stroke:var(--line);stroke-width:1}
.ct{fill:var(--muted);font:12px var(--body)}
.ccur{stroke:var(--chart-cur);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cprev{stroke:var(--chart-prev);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.cxl{stroke:var(--muted);stroke-dasharray:3 4}
.cdot{fill:var(--chart-cur);stroke:var(--surface);stroke-width:2}
.cdot2{fill:var(--chart-prev);stroke:var(--surface);stroke-width:2}
.ctip{position:absolute;pointer-events:none;background:#0f1a24;color:#fff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:200px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);z-index:2}
.ctip[hidden]{display:none}
.ctip b{text-transform:capitalize;font-size:14px}
.ctip span{display:flex;align-items:center;gap:8px}
.ctip em{font-style:normal;font-weight:600;margin-left:auto;padding-left:16px;font-variant-numeric:tabular-nums}
.ctip .lcur{border-top-color:#7fc4e8}.ctip .up{color:#62d39c}.ctip .down{color:#ff8fa3}
.dist{display:flex;flex-direction:column;gap:14px;margin:8px 0 18px}
.dr{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;gap:12px;align-items:center;text-decoration:none;color:var(--ink);font-size:15px}
.dr b{text-align:right;font-variant-numeric:tabular-nums}
.tr{height:10px;background:var(--sunken);border-radius:99px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--chart-cur);border-radius:99px}
.dr:hover .tr i{background:var(--brand-orange)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:16px}
.trio a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--muted);font-size:14px}
.trio b{font:600 26px/1.1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.trio b.up{color:var(--ok)}.trio b.down{color:var(--bad)}
.flush{padding:0!important;overflow:hidden}
.pad{padding:20px 22px 14px}
.lnk{color:var(--brand-blue);font-weight:500;text-decoration:none;white-space:nowrap}
.lnk:hover{text-decoration:underline}
table.tt{min-width:560px}
table.tt th{background:var(--sunken);padding:12px 22px;border-bottom:1px solid var(--line)}
table.tt td{padding:14px 22px;font-size:15px}
table.tt .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-size:15px}
table.tt .t:hover{color:var(--brand-blue)}
.chg{display:inline-block;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.chg.up{background:var(--ok-soft)}.chg.down{background:var(--bad-soft)}.chg.warn{background:var(--warn-soft);color:var(--warn)}
.att{list-style:none;margin:0;padding:0}
.att li{border-bottom:1px solid var(--line)}
.att li:last-child{border-bottom:0}
.att a{display:flex;gap:14px;align-items:flex-start;padding:14px 0;text-decoration:none;color:inherit}
.att a:hover b{color:var(--brand-blue)}
.att b{display:block;font-size:15px;margin-bottom:3px}
.ai{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.ai.bad{background:var(--bad-soft);color:var(--bad)}.ai.warn{background:var(--warn-soft);color:var(--warn)}.ai.info{background:var(--accent-soft);color:var(--brand-blue)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chartc .seg{width:100%}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.mtop{display:flex;gap:14px;align-items:flex-start}
.mph{position:relative;width:72px;height:72px;flex:none}
.mph img,.mph>span{width:72px;height:72px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--brand-blue));color:#fff;font:600 26px var(--body);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.mup{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--brand-orange);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 3px var(--surface)}
.mup:hover{background:var(--brand-blue)}
.mup:focus-within{outline:2px solid var(--brand-blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mid{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.mid h3{margin:0;font:600 17px/1.2 var(--body);overflow-wrap:anywhere}
.mid input[type=text]{width:100%;padding:6px 8px}
.mrole{margin:0;color:var(--brand-blue);font-weight:500}
.mdate{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mdate input{padding:4px 6px}
.msince{margin:0;font-size:13px}
.lnkb{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:14px}
.mstats>*{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;min-width:0}
.mstats b{font:600 20px/1.1 var(--body);font-variant-numeric:tabular-nums}
.mstats span{font-size:11.5px;color:var(--muted);line-height:1.25}
.mstats a:hover b{color:var(--brand-blue)}
.mperf{display:flex;flex-direction:column;gap:8px}
.mph2{display:flex;gap:8px;align-items:center;font-size:14px}
.mph2>span:first-child{color:var(--muted);flex:1}
.impbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px}
.impchk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--warn);text-transform:none!important;letter-spacing:0!important;font-size:14px!important;cursor:pointer}
.impbox textarea{background:var(--surface)}
.impnote{margin:0;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 9px;overflow-wrap:anywhere}
.shact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.shoot.isdone{border-left:3px solid var(--s-done)}
.pill.shootp{background:var(--accent-soft);color:var(--brand-blue)}
/* ===== Tableau de bord, mise en page en cartes ===== */
.fx{--fxr:22px}
.fxhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:-6px 0 20px}
.fxhello{margin:0 0 6px;font:600 clamp(28px,2.6vw,38px)/1.1 var(--body);letter-spacing:-.025em;color:var(--ink)}
.fxhead .meta{margin:0;font-size:15px}
.fxsel{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.fxg{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:stretch}
.fxg>.chartc{display:flex;flex-direction:column}.fxg>.chartc .fxcin{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.fxc{background:var(--surface);border-radius:var(--fxr);padding:22px;box-shadow:0 1px 2px rgba(16,24,32,.04);border:1px solid var(--line);min-width:0}
.fxc h2{margin:0;font:600 19px/1.2 var(--body);color:var(--ink)}
.fxcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.fxwide{grid-column:span 2}
.fxfull{grid-column:1/-1}
.fxbal{display:flex;flex-direction:column;gap:18px}
.fxbl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;text-decoration:none;color:inherit}
.fxlab{width:100%;color:var(--muted);font-size:15px}
.fxbl b{width:100%;font:600 40px/1.05 var(--body);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.fxbl b small{font-size:18px;font-weight:400;color:var(--muted)}
.fxpill{display:inline-block;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.fxpill.up{background:var(--ok-soft);color:var(--ok)}.fxpill.down{background:var(--bad-soft);color:var(--bad)}
.fxbtns{display:flex;flex-wrap:wrap;gap:10px}
.fxbtns .fxbtn{flex:1 1 auto;white-space:nowrap}
.fxbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:999px;padding:12px 16px;font:500 14.5px/1.15 var(--body);cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,transform .15s}
.fxbtn:hover{transform:translateY(-1px)}
.fxbtn.dark{background:#141a1f;color:#fff;border-color:#141a1f}
.fxbtn.dark[aria-pressed="false"]{background:var(--sunken);color:var(--ink);border-color:var(--line)}
.fxw{background:var(--sunken);border-radius:16px;padding:14px}
.fxwh{margin:0 0 10px;color:var(--muted);font-size:14px}.fxwh b{color:var(--ink)}
.fxwg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

window.crmConfig = firebaseConfig; window.crmAiModel = 'gemini-3.5-flash-lite'; window.crmRecaptchaKey = '';
let db = null, auth = null, me = null, phase = 'loading', unsub = [], canWrite = true, draft = null, loadTimer = null;

try { Object.assign(ui, JSON.parse(localStorage.getItem('moovcrm-filters') || '{}')); } catch (e) {}

const $ = (s, r) => (r || document).querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const proj = k => PROJECTS.find(p => p.k === k);
const member = id => state.members.find(m => m.id === id);
const mname = id => { const m = member(id); return m ? m.name : 'Ancien membre'; };
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fdate(s, long){
  if (!s) return '';
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('fr-FR', long ? {weekday:'long', day:'numeric', month:'long'} : {day:'numeric', month:'short'});
}

const arr = v => Array.isArray(v) ? v : [];

/* ---------- données ---------- */
function init(){
  render();
  if (!window.firebase) { phase = 'error'; note("Le CRM n'a pas pu se charger. Vérifiez la connexion puis rechargez la page."); render(); return; }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); auth.languageCode = 'fr'; db = firebase.firestore();
  auth.onAuthStateChanged(u => {
    unsub.forEach(f => f()); unsub = [];
    clearTimeout(loadTimer); note('');
    me = u; canWrite = true;
    Object.keys(loaded).forEach(k => loaded[k] = false);
    if (!u) { phase = 'login'; render(); return; }
    if (!u.emailVerified) { phase = 'verify'; render(); return; }
    phase = 'app'; subscribe(); render();
  });
}
function subscribe(){
  loadTimer = setTimeout(() => note("Les données ne sont pas encore joignables. Vérifiez la connexion, elles s'afficheront dès que possible."), 10000);
  ['members','tasks','shoots','access','spaces','messages','ai','meetings','reports'].concat(isAdminMe() ? ['supnotes'] : []).forEach(name => {
    const q = name === 'messages' ? db.collection(name).orderBy('at', 'desc').limit(200) : db.collection(name);
    unsub.push(q.onSnapshot(snap => {
      state[name] = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      if (name === 'messages') { state.messages.reverse(); chatAlerts(snap); }
      if (!snap.metadata.fromCache) lastSync = Date.now();
      if (name in loaded) loaded[name] = true;
      if (!snap.metadata.fromCache && loaded.members && loaded.tasks && loaded.shoots) { clearTimeout(loadTimer); note(''); }
      render();
    }, err => {
      clearTimeout(loadTimer);
      if (!(name in loaded)) return;
      if (err && err.code === 'permission-denied') phase = 'denied';
      else note("Les données ne peuvent pas être lues pour le moment. Rechargez la page.");
      if (name in loaded) loaded[name] = true;
      render();
    }));
  });
}
async function write(fn, what){
  if (!db || !canWrite) return false;
  try { await fn(); return true; }
  catch (e) {
    if (e && e.code === 'permission-denied') note(what === 'access' ? "Seule l'administratrice du CRM peut ajouter ou retirer des accès." : "Vous n'avez pas le droit de modifier le CRM avec ce compte.");
    else if (e && e.code === 'resource-exhausted') note("Le quota gratuit du jour est atteint. Réessayez demain.");
    else note("L'enregistrement n'a pas abouti. Vérifiez la connexion puis réessayez.");
    return false;
  }
}

/* ---------- rendu ---------- */
function view(){ const h = location.hash.replace('#','');
  if (h.startsWith('univers-') && proj(h.slice(8))) { ui.u = h.slice(8); return 'univers'; }
  if (h === 'assistant') return 'assistant';
  if (h.startsWith('liste-') && LISTS[h.slice(6)]) { ui.list = h.slice(6); return 'liste'; }
  return ['tableau','supervision','fondateur','mes-taches','taches','tournages','reunions','discussion','rapport','suivi','equipe'].includes(h) ? h : 'tableau'; }
function render(){
  const v = view(), app = phase === 'app';
  $('#side').hidden = !app; $('#tb').hidden = !app; document.body.dataset.view = app ? v : '';
  const cur = v === 'univers' ? 'univers-' + ui.u : v;
  $('#ptitle').textContent = !app ? 'CRM Marketing' : v === 'univers' ? proj(ui.u).n : v === 'liste' ? LISTS[ui.list].t : TITLES[v];
  $('#crumb').textContent = app ? new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) + (v === 'univers' ? ' · univers' : '') : '';
  const lv = $('#live');
  const off = typeof navigator !== 'undefined' && navigator.onLine === false;
  lv.className = 'tbib live' + (off ? ' off' : ''); lv.dataset.tip = off ? 'Hors ligne' : 'En direct' + (lastSync ? ' · synchronisé à ' + new Date(lastSync).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '');
  { const dk = document.documentElement.dataset.theme === 'dark'; $('#tLight').setAttribute('aria-pressed', String(!dk)); $('#tDark').setAttribute('aria-pressed', String(dk)); }
  { const mm = me && member(myId()), nm = (mm && mm.name) || (me && me.displayName) || (me ? String(me.email).split('@')[0] : '');
    $('#who').innerHTML = me ? `<span class="tbav">${mm && mm.photo ? `<img src="${esc(mm.photo)}" alt="">` : esc(String(nm).trim().charAt(0).toUpperCase())}</span><span class="tbun"><b>${esc(nm)}</b><span>${esc(me.email)}</span></span>` : ''; }
  document.querySelectorAll('#nav a, #side a').forEach(a => a.getAttribute('href') === '#' + cur ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if (phase === 'loading') { $('#main').innerHTML = '<p class="empty">Chargement…</p>'; return; }
  if (phase === 'error') { $('#main').innerHTML = ''; return; }
  document.body.classList.toggle('gate-on', phase === 'login' || phase === 'verify' || phase === 'denied');
  if (phase === 'login' || phase === 'verify' || phase === 'denied') { const ke = $('#lgEmail'); if (ke) gate.email = ke.value; $('#main').innerHTML = vGate(); orbStart(); return; }
  const ready = loaded.members && loaded.tasks && loaded.shoots;
  if (!ready) { $('#main').innerHTML = '<p class="empty">Chargement des données de l\'équipe…</p>'; return; }
  const ci = $('#chatText'), keep = ci ? {v: ci.value, f: document.activeElement === ci} : null;
  if (v === 'discussion' && state.messages.length) { const last = state.messages[state.messages.length - 1].at || 0; if (last > ui.seen) { ui.seen = last; keepFilters(); } }
  const unread = state.messages.filter(m => (m.at || 0) > ui.seen && m.email !== (me && me.email)).length;
  $('#bdot').hidden = !unread;
  $('#navChat').innerHTML = 'Discussion' + (unread ? `<span class="nbadge" aria-label="${unread} non lu${unread > 1 ? 's' : ''}">${unread > 99 ? '99+' : unread}</span>` : '');
  const mid = myId(), mineOpen = mid ? state.tasks.filter(x => x.status !== 'done' && arr(x.who).includes(mid)).length : 0, mineLate = mid ? state.tasks.filter(x => isLate(x) && arr(x.who).includes(mid)).length : 0;
  $('#navMine').innerHTML = 'Mes tâches' + (mineOpen ? `<span class="nbadge"${mineLate ? '' : ' style="background:var(--line);color:var(--ink)"'}>${mineOpen}</span>` : '');
  $('#navSup').hidden = !(app && allowed('supervision')); $('#navFound').hidden = !(app && allowed('fondateur'));
  document.title = (app && unread ? '(' + unread + ') ' : '') + 'CRM Marketing Moov Up';
  $('#main').innerHTML = ({tableau: vDash, liste: vList, supervision: vSup, fondateur: vFounder, 'mes-taches': vMine, reunions: vMeet, rapport: vReport, univers: vUnivers, assistant: vAssistant, discussion: vChat, taches: vTasks, tournages: vShoots, suivi: vSuivi, equipe: vTeam})[v]();
  if (cur !== lastView) { lastView = cur; const mn = $('#main'); mn.classList.remove('enter'); void mn.offsetWidth; mn.classList.add('enter'); countUp(); }
  if (v === 'discussion') {
    const box = $('#chatBox'); if (box) box.scrollTop = box.scrollHeight;
    const n = $('#chatText'); if (n && keep) { n.value = keep.v; if (keep.f) n.focus(); }
  }
}
const dis = () => canWrite ? '' : ' disabled';

function vTasks(){
  let list = state.tasks.slice();
  if (ui.kind !== 'all') list = list.filter(t => t.kind === ui.kind);
  if (ui.person) list = list.filter(t => arr(t.who).includes(ui.person));
  if (ui.project) list = list.filter(t => inP(t, ui.project));
  list.sort((a,b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.createdAt || 0) - (b.createdAt || 0));
  const seg = [['all','Toutes'],['indiv','Individuelles'],['collectif','Collectives']]
    .map(([k,l]) => `<button type="button" data-act="kind" data-v="${k}" aria-pressed="${ui.kind === k}">${l}</button>`).join('');
  const cols = STATUS.map(([k,l]) => {
    const items = list.filter(t => (t.status || 'todo') === k);
    return `<div class="col k-${k}"><h2><span>${l}</span><span>${items.length}</span></h2>${items.map(taskCard).join('') || '<p class="empty">Rien ici.</p>'}</div>`;
  }).join('');
  return `<div class="bar">
    <div class="seg" role="group" aria-label="Type de tâche">${seg}</div>
    <select id="fPerson" data-chg="person" aria-label="Filtrer par personne"><option value="">Toute l'équipe</option>${state.members.map(m => `<option value="${esc(m.id)}"${ui.person === m.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <select id="fProject" data-chg="project" aria-label="Filtrer par univers"><option value="">Tous les univers</option>${PROJECTS.map(p => `<option value="${p.k}"${ui.project === p.k ? ' selected' : ''}>${esc(p.n)}</option>`).join('')}</select>
    <span class="grow"></span>
    <button type="button" class="btn primary" data-act="newTask"${dis()}>Nouvelle tâche</button>
  </div>
  ${state.members.length ? '' : '<p class="note">Ajoutez d\'abord les membres dans l\'onglet Équipe pour pouvoir attribuer les tâches.</p>'}
  <div class="board">${cols}</div>`;
}
function taskCard(t){
  const late = isLate(t);
  const who = arr(t.who).map(id => `<span class="pill">${esc(mname(id))}</span>`).join('');
  return `<article class="card${late ? ' late' : ''}">
    <button type="button" class="t" data-act="editTask" data-id="${esc(t.id)}">${esc(t.title)}</button>
    <div class="meta">
      <span class="pill ${t.kind === 'collectif' ? 'kind-c' : ''}">${t.kind === 'collectif' ? 'Collective' : 'Individuelle'}</span>
      ${t.fromShoot ? '<span class="pill shootp">Tournage</span>' : ''}${tChips(t)}${who}
    </div>
    <div class="meta">
      ${t.due ? `<span class="pill ${dueCls(t)}">${late ? 'En retard, ' : 'Pour le '}${esc(fdate(t.due))}</span>` : '<span>Sans échéance</span>'}${estPill(t)}${impPill(t)}
      <span class="grow" style="flex:1"></span>
      <select data-chg="status" data-id="${esc(t.id)}" aria-label="Statut de la tâche"${dis()}>${STATUS.map(([k,l]) => `<option value="${k}"${(t.status || 'todo') === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${t.imprevu && t.imprevuNote ? `<p class="impnote"><b>Imprévu :</b> ${esc(t.imprevuNote)}</p>` : ''}
  </article>`;
}

/* tournages */
function mins(s){ if (!s) return null; const [h,m] = s.split(':').map(Number); return h*60 + m; }
function span(s){ const a = mins(s.start); if (a == null) return [0, 1440]; const b = mins(s.end); return [a, b != null && b > a ? b : a + 120]; }
function conflicts(s){
  if (!s.date) return [];
  const [a1,b1] = span(s);
  return state.shoots.filter(o => o.id !== s.id && o.date === s.date).filter(o => { const [a2,b2] = span(o); return a1 < b2 && a2 < b1; })
    .map(o => ({o, shared: arr(s.people).filter(id => arr(o.people).includes(id))}));
}
function vShoots(){
  const t = today();
  const sorted = state.shoots.slice().sort((a,b) => ((a.date || '') + (a.start || '')).localeCompare((b.date || '') + (b.start || '')));
  const up = sorted.filter(s => !s.date || s.date >= t), past = sorted.filter(s => s.date && s.date < t).reverse();
  return `<div class="bar">
    <span>${up.length} tournage${up.length > 1 ? 's' : ''} à venir</span><span class="grow"></span>
    <button type="button" class="btn primary" data-act="newShoot"${dis()}>Nouveau tournage</button>
  </div>
  ${up.map(shootCard).join('') || '<p class="empty">Aucun tournage prévu. Créez le premier pour répartir les univers, les personnes et le matériel.</p>'}
  ${past.length ? `<details class="past"><summary>Tournages passés (${past.length})</summary>${past.map(shootCard).join('')}</details>` : ''}`;
}
const SPF = {spName:'name', spPhone:'phone', spInsta:'insta', spNote:'note'};
const EST = [[15,'15 min'],[30,'30 min'],[60,'1 h'],[120,'2 h'],[180,'3 h'],[240,'Une demi-journée'],[480,'1 jour'],[960,'2 jours'],[1440,'3 jours'],[2400,'1 semaine']];
const estTxt = m => { m = +m || 0; if (!m) return ''; if (m < 60) return m + ' min'; if (m < 480) { const h = Math.round(m / 6) / 10; return (h + ' h').replace('.', ','); } const d = Math.round(m / 48) / 10; return (d + ' j').replace('.', ','); };
const estPill = x => x.est ? `<span class="pill" title="Durée estimée">⏱ ${esc(estTxt(x.est))}</span>` : '';
const impPill = x => x.imprevu ? `<span class="pill warn" title="${esc('Imprévu : ' + (x.imprevuNote || ''))}">Imprévu</span>` : '';
const dueCls = x => isLate(x) ? (x.imprevu ? 'warn' : 'bad') : '';
const tP = x => arr(x.projects).length ? arr(x.projects) : (x.project ? [x.project] : []);
const inP = (x, k) => tP(x).includes(k);
const tChips = x => tP(x).length === PROJECTS.length ? '<span class="pill">Tous les univers</span>' : tP(x).map(projChip).join('');
const space = k => state.spaces.find(x => x.id === k) || {};
function waNumber(p){ let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (d.length === 10 && d[0] === '0') d = '212' + d.slice(1); return d.length >= 9 ? d : ''; }
function waText(s, p, c){
  const when = (s.date ? 'le ' + fdate(s.date, true) : 'à une date à confirmer') + (s.start ? ' de ' + s.start + (s.end ? ' à ' + s.end : '') : '');
  return `Bonjour${c.name ? ' ' + c.name : ''}, l'équipe marketing Moov Up prévoit un tournage ${when} pour ${p.n}` + (s.place ? `, lieu : ${s.place}` : '') + (s.guests ? `. Personnes concernées : ${s.guests}` : '') + `. Merci de prévenir votre équipe et les adhérents présents, et de me confirmer que c'est bon pour vous.`;
}
function pending(s){ return s.done ? [] : arr(s.projects).filter(k => proj(k) && !(s.notified || {})[k]); }
function spacesBlock(s){
  const ps = arr(s.projects).filter(proj); if (!ps.length || s.done) return '';
  return `<div class="spaces"><h4>Espaces à prévenir avant le tournage</h4>${ps.map(k => {
    const p = proj(k), c = space(k), n = (s.notified || {})[k], tel = waNumber(c.phone);
    const st = n && n.ok ? '<span class="pill ok">A confirmé</span>' : n ? `<span class="pill warn">Prévenu le ${esc(new Date(n.at).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}))}</span>` : '<span class="pill bad">Pas encore prévenu</span>';
    const act = tel ? `<a class="btn small" href="https://wa.me/${tel}?text=${encodeURIComponent(waText(s, p, c))}" target="_blank" rel="noopener" data-act="notify" data-id="${esc(s.id)}" data-k="${k}">${n ? 'Relancer' : 'Prévenir'} sur WhatsApp</a>` : '<a href="#equipe">Ajouter son numéro WhatsApp</a>';
    return `<div class="sp">${projChip(k)}<span>${esc(c.name || 'Responsable non renseigné')}</span>${st}<span class="grow"></span>${n ? `<label class="check"><input type="checkbox" data-chg="confirm" data-id="${esc(s.id)}" data-k="${k}"${n.ok ? ' checked' : ''}${dis()}><span>A confirmé</span></label>` : ''}${act}</div>`;
  }).join('')}</div>`;
}
async function shootDone(id){
  const s = state.shoots.find(x => x.id === id); if (!s || !canWrite) return;
  const now = Date.now(), who = arr(s.people).length ? arr(s.people) : (myId() ? [myId()] : []);
  const shots = arr(s.shots), mins = (s.start && s.end) ? Math.max(0, mins2(s.end) - mins2(s.start)) : 0;
  const ok1 = await write(() => db.collection('shoots').doc(id).update({done: true, doneAt: now, doneBy: whoAmI(), updatedAt: now, updatedBy: whoAmI()}));
  if (!ok1) return;
  await write(() => db.collection('tasks').doc('tournage-' + id).set({title: 'Tournage : ' + (s.title || 'sans titre'), kind: who.length > 1 ? 'collectif' : 'indiv', who, projects: arr(s.projects), project: arr(s.projects)[0] || '',
    status: 'done', due: s.date || today(), est: mins, note: shots.length ? `${shots.filter(x => x.done).length} plan${shots.length > 1 ? 's' : ''} filmé${shots.filter(x => x.done).length > 1 ? 's' : ''} sur ${shots.length}` + (s.place ? ' · ' + s.place : '') : (s.place || ''),
    fromShoot: id, createdAt: now, createdBy: whoAmI(), updatedAt: now, updatedBy: whoAmI(), doneAt: now, imprevu: false, imprevuNote: '', imprevuAt: null}));
}
async function shootUndo(id){
  if (!canWrite) return;
  const ok = await write(() => db.collection('shoots').doc(id).update({done: false, doneAt: null, doneBy: '', updatedAt: Date.now(), updatedBy: whoAmI()}));
  if (ok) await write(() => db.collection('tasks').doc('tournage-' + id).delete());
}
const mins2 = v => { const [h,m] = String(v).split(':').map(Number); return h * 60 + (m || 0); };
function shootCard(s){
  const cf = s.done ? [] : conflicts(s);
  const alert = cf.map(({o, shared}) => `<div class="alert">Même créneau que « ${esc(o.title || 'un autre tournage')} »${shared.length ? ' : ' + esc(shared.map(mname).join(', ')) + (shared.length > 1 ? ' sont prévus' : ' est prévu(e)') + ' sur les deux' : ''}.</div>`).join('');
  const shots = arr(s.shots), gear = arr(s.gear);
  const doneN = shots.filter(x => x.done).length;
  return `<article class="shoot${s.done ? ' isdone' : ''}">
    ${alert}
    <div class="when">
      <b>${s.date ? esc(fdate(s.date, true)) : 'Date à fixer'}</b>
      <span>${s.start ? esc(s.start) + (s.end ? ' à ' + esc(s.end) : '') : 'Heure à fixer'}</span><br>
      <span class="meta">${esc(s.place || 'Lieu à fixer')}</span>
    </div>
    <div>
      <h3>${esc(s.title || 'Tournage')}</h3>
      <div class="meta">${arr(s.projects).map(projChip).join('') || '<span>Aucun univers choisi</span>'}</div>
      <div class="meta" style="margin-top:6px">${arr(s.people).map(id => `<span class="pill">${esc(mname(id))}</span>`).join('') || '<span>Personne d\'assigné</span>'}${s.guests ? `<span>avec ${esc(s.guests)}</span>` : ''}</div>
      ${spacesBlock(s)}
      <div class="cols">
        <div><h4>Plans à filmer ${shots.length ? `(${doneN}/${shots.length})` : ''}</h4>
          ${shots.map((x,i) => `<label class="check${x.done ? ' done' : ''}"><input type="checkbox" data-chg="shot" data-id="${esc(s.id)}" data-i="${i}"${x.done ? ' checked' : ''}${dis()}><span><span class="x">${esc(x.text)}</span> ${projChip(x.project)}</span></label>`).join('') || '<p class="empty">Aucun plan listé.</p>'}
        </div>
        <div><h4>Matériel</h4>
          ${gear.map((x,i) => `<label class="check${x.ok ? ' done' : ''}"><input type="checkbox" data-chg="gear" data-id="${esc(s.id)}" data-i="${i}"${x.ok ? ' checked' : ''}${dis()}><span><span class="x">${esc(x.text)}</span>${x.who ? ` <span class="pill">${esc(mname(x.who))}</span>` : ' <span class="pill warn">personne ne l\'apporte</span>'}</span></label>`).join('') || '<p class="empty">Aucun matériel listé.</p>'}
        </div>
      </div>
      ${s.note ? `<p class="meta" style="margin:10px 0 0">${esc(s.note)}</p>` : ''}
      <div class="shact">${s.done ? `<span class="pill ok">✓ Tournage fait le ${esc(new Date(s.doneAt || Date.now()).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}))}${s.doneBy ? ' · ' + esc(s.doneBy) : ''}</span><span class="meta">ajouté aux tâches terminées</span><button type="button" class="btn small" data-act="shootUndo" data-id="${esc(s.id)}"${dis()}>Annuler</button>`
        : `<button type="button" class="btn small primary" data-act="shootDone" data-id="${esc(s.id)}"${dis()}>✓ Marquer comme fait</button>`}<button type="button" class="btn small" data-act="editShoot" data-id="${esc(s.id)}"${dis()}>Modifier</button></div>
    </div>
  </article>`;
}

/* suivi */
function counts(list){
  const c = {todo:0, doing:0, done:0, late:0, total:list.length};
  list.forEach(t => { c[t.status || 'todo']++; if (isLate(t)) c.late++; });
  c.pct = c.total ? Math.round(c.done / c.total * 100) : 0;
  return c;
}
function rowCells(c){
  return `<td class="n">${c.todo}</td><td class="n">${c.doing}</td><td class="n">${c.done}</td>
    <td class="n">${c.late ? `<span class="pill bad">${c.late}</span>` : '0'}</td>
    <td><div class="prog" role="img" aria-label="${c.pct} % terminé"><i style="width:${c.pct}%"></i></div></td><td class="n">${c.pct} %</td>`;
}
function vSuivi(){

const onTimeOf = x => { if (!x.due || !x.doneAt) return true; const [y,mo,d] = x.due.split('-').map(Number); return x.doneAt < new Date(y, mo-1, d + 1).getTime(); };
function perf(m){
  const D = 864e5, now = Date.now(), mine = state.tasks.filter(x => arr(x.who).includes(m.id));
  const done = mine.filter(x => x.status === 'done'), done30 = done.filter(x => (x.doneAt || 0) > now - 30 * D).length;
  const timed = done.filter(x => x.due && x.doneAt), onTime = timed.filter(x => { const [y,mo,d] = x.due.split('-').map(Number); return x.doneAt < new Date(y, mo-1, d + 1).getTime(); }).length;
  const lateJ = mine.filter(x => isLate(x) && x.imprevu).length;
  const counted = timed.filter(x => !(x.imprevu && !onTimeOf(x)));
  const rate = counted.length ? counted.filter(onTimeOf).length / counted.length : null, late = mine.filter(x => isLate(x) && !x.imprevu).length, doing = mine.filter(x => x.status === 'doing').length;

async function setPhoto(id, file){
  if (!file || !/^image\//.test(file.type)) { note("Choisissez une image (JPG ou PNG)."); return; }
  try {
    const url = URL.createObjectURL(file), img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S; const c = cv.getContext('2d'), k = Math.min(img.width, img.height);
    c.drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, S, S); URL.revokeObjectURL(url);
    const data = cv.toDataURL('image/jpeg', .82);
    if (data.length > 400000) { note("Cette photo est trop lourde même après réduction. Essayez une autre image."); return; }
    await write(() => db.collection('members').doc(id).update({photo: data}));
  } catch (e) { note("La photo n'a pas pu être lue. Essayez une autre image (JPG ou PNG)."); }
}

/* rapport du jour */
function usage(day){
  const [y,m,d] = day.split('-').map(Number), a = new Date(y, m-1, d).getTime(), b = a + 864e5, on = ts => ts >= a && ts < b;
  const people = new Set(), add = n => { if (n) people.add(n); };
  const created = state.tasks.filter(x => on(x.createdAt)), done = state.tasks.filter(x => on(x.doneAt)), upd = state.tasks.filter(x => on(x.updatedAt) && !on(x.createdAt));
  created.forEach(x => add(x.createdBy)); upd.concat(done).forEach(x => add(x.updatedBy));
  const shoots = state.shoots.filter(x => on(x.createdAt) || on(x.updatedAt)); shoots.forEach(x => add(x.updatedBy));
  const msgs = state.messages.filter(x => on(x.at)); msgs.forEach(x => add(x.name || String(x.email || '').split('@')[0]));
  const meets = state.meetings.filter(x => x.date === day || on(x.updatedAt)); meets.forEach(x => add(x.updatedBy));
  const notif = state.shoots.reduce((n,s) => n + Object.values(s.notified || {}).filter(v => on(v.at)).length, 0);
  return {created, done, upd, shoots, msgs, meets, notif, people: Array.from(people), total: state.members.length};
}

function syncDraft(){
  const d = draft, f = $('#dlgForm'), val = id => { const e = $('#' + id, f); return e ? e.value.trim() : ''; };
  const checked = n => Array.from(f.querySelectorAll(`input[name="${n}"]:checked`)).map(e => e.value);
  d.title = val('dTitle'); d.note = val('dNote');
  if (d.type === 'meet') {
    d.date = val('dDate'); d.start = val('dStart'); d.place = val('dPlace'); d.agenda = val('dAgenda'); d.people = checked('people');
    d.decisions = d.decisions.map((x,i) => f.querySelector(`[data-dec="${i}"]`).value.trim());
  } else if (d.type === 'task') {
    d.kind = (f.querySelector('input[name="kind"]:checked') || {}).value || 'indiv';
    d.who = checked('who'); d.projects = checked('tprojects'); d.est = +val('dEst') || 0;
    { const ic = $('#dImp', f); if (ic) d.imprevu = ic.checked; const inote = $('#dImpNote', f); if (inote) d.imprevuNote = inote.value.trim(); } d.status = val('dStatus') || 'todo'; d.due = val('dDue');
  } else {
    d.date = val('dDate'); d.start = val('dStart'); d.end = val('dEnd'); d.place = val('dPlace'); d.guests = val('dGuests');
    d.projects = checked('projects'); d.people = checked('people');
    d.shots.forEach((x,i) => { x.text = f.querySelector(`[data-shot="${i}"]`).value.trim(); x.project = f.querySelector(`[data-shotp="${i}"]`).value; });
    d.gear.forEach((x,i) => { x.text = f.querySelector(`[data-gear="${i}"]`).value.trim(); x.who = f.querySelector(`[data-gearw="${i}"]`).value; });
  }
}
async function saveDraft(){
  syncDraft();
  const d = draft;
  if (!d.title) return drawDialog(d.type === 'meet' ? 'Écrivez le sujet de la réunion avant d\'enregistrer.' : d.type === 'task' ? 'Écrivez la tâche avant d\'enregistrer.' : 'Donnez un nom au tournage avant d\'enregistrer.');
  let data, col;
  if (d.type === 'meet') {
    col = 'meetings';
    data = {title:d.title, date:d.date, start:d.start, place:d.place, people:d.people, agenda:d.agenda, note:d.note, decisions:d.decisions.filter(Boolean), createdAt: d.createdAt || Date.now(), createdBy: d.createdBy || whoAmI(), updatedAt: Date.now(), updatedBy: whoAmI()};
  } else if (d.type === 'task') {
    if (d.imprevu && !d.imprevuNote) return drawDialog('Expliquez l\'imprévu en quelques mots avant d\'enregistrer.');
    if (d.kind === 'indiv' && d.who.length !== 1) return drawDialog('Une tâche individuelle a une seule personne. Choisissez-en une, ou passez la tâche en Collective.');
    col = 'tasks';
    data = {title:d.title, kind:d.kind, who:d.who, projects:d.projects, project:d.projects[0] || '', est: d.est, imprevu: !!d.imprevu, imprevuNote: d.imprevu ? d.imprevuNote : '', imprevuAt: d.imprevu ? (d.imprevuAt || Date.now()) : null, status:d.status, due:d.due, note:d.note, createdAt: d.createdAt || Date.now(), createdBy: d.createdBy || whoAmI(), updatedAt: Date.now(), updatedBy: whoAmI(), doneAt: d.status === 'done' ? (d.doneAt || Date.now()) : null};
  } else {
    col = 'shoots';
    data = {title:d.title, date:d.date, start:d.start, end:d.end, place:d.place, projects:d.projects, people:d.people, guests:d.guests,
      shots: d.shots.filter(x => x.text).map(x => ({text:x.text, project:x.project || '', done: !!x.done})),
      gear: d.gear.filter(x => x.text).map(x => ({text:x.text, who:x.who || '', ok: !!x.ok})), notified: d.notified || {}, note:d.note, createdAt: d.createdAt || Date.now(), updatedAt: Date.now(), updatedBy: whoAmI()};
  }
  const ref = d.id ? db.collection(col).doc(d.id) : db.collection(col).doc();
  if (await write(() => ref.set(data))) $('#dlg').close();
  else drawDialog("L'enregistrement n'a pas abouti. Réessayez.");
}

  else if (a === 'rmPhoto') await write(() => db.collection('members').doc(id).update({photo: firebase.firestore.FieldValue.delete()}));

  else if (a === 'cmp') { ui.cmp = ui.cmp === false; keepFilters(); render(); }

<script type="module">
// IA : Gemini via Firebase AI Logic. Si ce module ne se charge pas, le CRM fonctionne sans IA.
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-ai.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app-check.js";
const app = initializeApp(window.crmConfig, "ai");
if (window.crmRecaptchaKey) initializeAppCheck(app, { provider: new ReCaptchaV3Provider(window.crmRecaptchaKey), isTokenAutoRefreshEnabled: true });
const model = getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: window.crmAiModel });
window.crmAI = { ask: async prompt => (await model.generateContent(prompt)).response.text() };
</script>
</body>
</html>
